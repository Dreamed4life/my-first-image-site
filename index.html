
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Image Website</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      box-sizing: border-box;
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;
    }

    main {
      width: 100%;
      max-width: 700px;
      text-align: center;
      background: #1f2937;
      padding: 20px;
      border-radius: 18px;
      box-sizing: border-box;
    }

    img {
      width: 100%;
      max-height: 450px;
      object-fit: contain;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <main>
    <h1>My Image Website</h1>
    <img
      src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1200&q=80"
      alt="Scenic landscape"
    >
    <p>Thanks for visiting my website!</p>
  </main>
</body>
</html>
